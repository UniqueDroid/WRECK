[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wreck-re"
version = "0.1.0"
description = "WRECK – Watch Reverse Engineering & Cracking Kit: Bauplan und CLI, um China-Smartwatches legal und nachvollziehbar zu analysieren und anzupassen."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "UniqueDroid" }]
keywords = ["reverse-engineering", "smartwatch", "firmware", "jieli", "interoperability", "ai-agents"]
dependencies = []

[project.scripts]
wreck = "wreck.cli:main"

[tool.setuptools.packages.find]
include = ["wreck*"]

[tool.setuptools.package-data]
wreck = ["data/*.json"]
